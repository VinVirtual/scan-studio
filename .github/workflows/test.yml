name: test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      # Every test runs here, the end-to-end pipeline on tests/data/jug-frames included (CPU only).
      # Nothing is skipped: a missing package fails the run. Not run in CI: Blender (only to remake the
      # example capture) and the headless-Chrome screenshots (tools/render.mjs).
      - name: Install Python packages
        run: python -m pip install -r requirements-dev.txt
      - name: Check the environment
        run: SCAN_STUDIO_PYTHON=python ./check_env.sh
      - name: Unit and pipeline tests
        run: SCAN_STUDIO_PYTHON=python ./scan-studio test
